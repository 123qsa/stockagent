# RAGFlow 最小化部署配置
# 用于股票公告深度解析与检索
#
# 前置要求：
#   - Docker >= 24.0.0, Docker Compose >= v2.26.1
#   - CPU >= 4核, RAM >= 16GB, Disk >= 50GB
#   - x86_64 架构（ARM64 需手动构建镜像）
#
# 启动：
#   docker compose -f docker-compose.ragflow.yml up -d
#
# 首次启动需要下载模型（约 2GB），请耐心等待。
# 服务就绪后访问 http://localhost:9380，默认账号 admin@ragflow.io / ragflow
#
# 与股票分析系统集成：
#   1. 在 .env 中配置：
#      RAGFLOW_API_KEY=ragflow-your-api-key
#      RAGFLOW_BASE_URL=http://localhost:9380
#   2. 使用 python main.py ragflow-sync 000001 上传公告
#   3. 使用 python main.py ragflow-query 000001 "2024年净利润是多少"

name: ragflow-stock

services:
  ragflow:
    image: infiniflow/ragflow:v0.25.6
    container_name: ragflow-server
    ports:
      - "9380:9380"
      - "80:80"
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      # 使用 Infinity 作为文档引擎（比 ES 更轻量）
      - DOC_ENGINE=infinity
      - INFINITY_HOST=infinity
      - INFINITY_PORT=23817
      - INFINITY_HTTP_PORT=23820
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DBNAME=rag_flow
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_HOST=minio
      - MINIO_PORT=9000
    volumes:
      - ragflow_data:/ragflow
      - ./data/announcements:/data/announcements:ro
    depends_on:
      mysql:
        condition: service_healthy
      infinity:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - ragflow
    restart: unless-stopped

  mysql:
    image: mysql:8.0.39
    container_name: ragflow-mysql
    env_file:
      - .env
    environment:
      - MYSQL_ROOT_PASSWORD=infini_rag_flow
    command: >
      --max_connections=1000
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --binlog_expire_logs_seconds=604800
    ports:
      - "5455:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./ragflow/docker/init.sql:/data/application/init.sql
    networks:
      - ragflow
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-pinfini_rag_flow"]
      interval: 10s
      timeout: 10s
      retries: 120
    restart: unless-stopped

  infinity:
    image: infiniflow/infinity:v0.7.0
    container_name: ragflow-infinity
    volumes:
      - infinity_data:/var/infinity
      - ./ragflow/docker/infinity_conf.toml:/infinity_conf.toml
    command: ["-f", "/infinity_conf.toml"]
    ports:
      - "23817:23817"
      - "23820:23820"
    networks:
      - ragflow
    healthcheck:
      test: ["CMD", "curl", "http://localhost:23820/admin/node/current"]
      interval: 10s
      timeout: 10s
      retries: 120
    restart: unless-stopped

  redis:
    image: valkey/valkey:8
    container_name: ragflow-redis
    command: >
      redis-server
      --requirepass infini_rag_flow
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ragflow
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "infini_rag_flow", "ping"]
      interval: 10s
      timeout: 10s
      retries: 120
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2026-03-25T00-00-00Z
    container_name: ragflow-minio
    command: ["server", "--console-address", ":9001", "/data"]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=ragflow
      - MINIO_ROOT_PASSWORD=infini_rag_flow
    volumes:
      - minio_data:/data
    networks:
      - ragflow
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 10s
      retries: 120
    restart: unless-stopped

volumes:
  ragflow_data:
  mysql_data:
  infinity_data:
  redis_data:
  minio_data:

networks:
  ragflow:
    driver: bridge
